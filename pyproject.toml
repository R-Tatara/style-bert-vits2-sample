[project]
name = "style-bert-vits2-sample"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "style-bert-vits2",
    "soundfile",
    "setuptools<82",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
